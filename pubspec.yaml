name: piclayout
description: A local-first Flutter photo collage editor for iOS and Android.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.3.0
  file_selector: ^1.1.0
  collection: ^1.18.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  image: ^4.3.0
  image_picker: ^1.1.2
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_logo.png
    - assets/demo/
